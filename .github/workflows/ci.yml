name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analyse:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, pdo_sqlite, sqlite3, xml
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer analyse

  format:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, pdo_sqlite, sqlite3, xml
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer format

  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.framework.laravel }} / ${{ matrix.preference }} dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        framework:
          - laravel: '11'
            testbench: '9.18'
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
        preference: [lowest, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, pdo_sqlite, sqlite3, xml
          tools: composer:v2
          coverage: none
      - name: Resolve dependencies
        run: |
          flags=(--prefer-stable)
          if [ "${{ matrix.preference }}" = "lowest" ]; then
            flags+=(--prefer-lowest)
          fi
          if [ "${{ matrix.preference }}" = "lowest" ] || [ "${{ matrix.framework.laravel }}" = "11" ]; then
            flags+=(--no-blocking)
          fi
          composer update --no-interaction --prefer-dist "${flags[@]}" --with="orchestra/testbench:^${{ matrix.framework.testbench }}" --with-all-dependencies
      - run: composer test